[project]
name = "hydrogen_s_state_2_photon"
version = "0.1.0"
description = "A collection of code used for the calculation of various 2-photon effects in atomic hydrogen."
readme = "README.md"
requires-python = ">=3.7"
dependencies = [ 
  "numpy>=1.19.5"
  "scipy>=1.16.0"
  "matplotlib>=3.1.0"
  "seaborn>=0.11.1"
  "pandas>=1.3.0"
]
license = { text = "CC0 1.0" }           
authors = [
  { name = "Joseph P. Scott" }
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"
